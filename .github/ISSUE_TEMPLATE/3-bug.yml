name: "Bug"
description: "Quelque chose ne fonctionne pas comme prévu"
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: probleme
    attributes:
      label: "Que se passe-t-il ?"
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: "Étapes pour reproduire"
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: "Résultat attendu"
    validations:
      required: true
  - type: dropdown
    id: ou
    attributes:
      label: "Où ?"
      options: ["Application Android", "Application iPhone", "Espace admin", "Base de données"]
    validations:
      required: true
  - type: input
    id: appareil
    attributes:
      label: "Appareil et version"
      placeholder: "Ex. Samsung A52, Android 14 / iPhone 13, iOS 18 / Chrome"
  - type: textarea
    id: captures
    attributes:
      label: "Captures d'écran ou vidéo"
